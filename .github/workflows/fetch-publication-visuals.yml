name: Fetch publication visuals

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch-publication-visuals.yml"

permissions:
  contents: write

jobs:
  fetch:
    if: github.event.head_commit.message == 'add one-time publication visual fetcher'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil

      - name: Fetch open-access publication visuals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/publications .tmp-publications

          # Scientific Data 2025, Fig. 2 (CC BY 4.0)
          curl -L --fail --retry 3 -A "Mozilla/5.0" \
            "https://media.springernature.com/lw1200/springer-static/image/art%3A10.1038%2Fs41597-025-05872-2/MediaObjects/41597_2025_5872_Fig2_HTML.png" \
            -o .tmp-publications/gammarus-fig2.png

          # Diversity 2023 open-access PDF (CC BY 4.0); Figure 5 is extracted below.
          curl -L --fail --retry 3 -A "Mozilla/5.0" \
            "https://findresearcher.sdu.dk/ws/portalfiles/portal/220167770/diversity_15_00031.pdf" \
            -o .tmp-publications/diversity.pdf

          # Environmental Pollution 2024 graphical abstract (CC BY-NC).
          # If the publisher CDN refuses the request, use the copy embedded in the author's open thesis.
          if ! curl -L --fail --retry 3 -A "Mozilla/5.0" \
            "https://ars.els-cdn.com/content/image/1-s2.0-S026974912401114X-ga1_lrg.jpg" \
            -o .tmp-publications/envpoll-ga.jpg; then
            rm -f .tmp-publications/envpoll-ga.jpg
          fi

          # Author thesis (CC BY-NC), used for the PLOS chapter graphical abstract and as fallback above.
          curl -L --fail --retry 3 -A "Mozilla/5.0" \
            "https://kups.ub.uni-koeln.de/75069/3/Thesis_Escobar_Sierra_Print_KUPS.pdf" \
            -o .tmp-publications/thesis.pdf

          # EchoGO logo from exact latest public release v0.1.4.
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/miloes114/EchoGo/v0.1.4/man/figures/echogo-logo.png" \
            -o .tmp-publications/echogo-logo.png

      - name: Extract thesis graphical abstracts and optimise raster assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          from PIL import Image, ImageChops

          tmp = Path(".tmp-publications")
          out = Path("assets/images/publications")
          out.mkdir(parents=True, exist_ok=True)

          def page_count(pdf):
              txt = subprocess.check_output(["pdfinfo", str(pdf)], text=True, errors="ignore")
              for line in txt.splitlines():
                  if line.startswith("Pages:"):
                      return int(line.split(":",1)[1].strip())
              raise RuntimeError("Could not determine PDF page count")

          def page_text(pdf, p):
              return subprocess.check_output(
                  ["pdftotext","-f",str(p),"-l",str(p),"-layout",str(pdf),"-"],
                  text=True, errors="ignore"
              )

          def find_pages(pdf, needle):
              hits=[]
              for p in range(1, page_count(pdf)+1):
                  if needle.lower() in page_text(pdf,p).lower():
                      hits.append(p)
              return hits

          def trim_white(im):
              im = im.convert("RGB")
              bg = Image.new("RGB", im.size, "white")
              diff = ImageChops.difference(im, bg).convert("L")
              mask = diff.point(lambda x: 255 if x > 12 else 0)
              bbox = mask.getbbox()
              if bbox:
                  pad = 16
                  l,t,r,b = bbox
                  bbox=(max(0,l-pad),max(0,t-pad),min(im.width,r+pad),min(im.height,b+pad))
                  im=im.crop(bbox)
              return im

          def save_webp(src, dest, maxw=1800):
              im=trim_white(Image.open(src))
              if im.width > maxw:
                  h=round(im.height*maxw/im.width)
                  im=im.resize((maxw,h), Image.Resampling.LANCZOS)
              im.save(dest, "WEBP", quality=90, method=6)

          def extract_largest_image(pdf, p, dest):
              with tempfile.TemporaryDirectory() as td:
                  prefix = Path(td)/"img"
                  subprocess.run(
                      ["pdfimages","-f",str(p),"-l",str(p),"-png",str(pdf),str(prefix)],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  )
                  candidates=[]
                  for f in Path(td).glob("img-*.png"):
                      try:
                          with Image.open(f) as im:
                              area=im.width*im.height
                              candidates.append((area,im.width,im.height,f))
                      except Exception:
                          pass
                  candidates=[x for x in candidates if x[1] >= 450 and x[2] >= 200]
                  if not candidates:
                      # Vector-only fallback: render the page and crop the central graphical-abstract region.
                      render = Path(td)/"page"
                      subprocess.run(
                          ["pdftoppm","-f",str(p),"-l",str(p),"-singlefile","-r","180","-png",str(pdf),str(render)],
                          check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                      )
                      page=Image.open(str(render)+".png").convert("RGB")
                      crop=page.crop((int(page.width*.08), int(page.height*.13), int(page.width*.92), int(page.height*.68)))
                      crop=trim_white(crop)
                      if crop.width > 1800:
                          h=round(crop.height*1800/crop.width)
                          crop=crop.resize((1800,h), Image.Resampling.LANCZOS)
                      crop.save(dest,"WEBP",quality=90,method=6)
                      return
                  candidates.sort(reverse=True)
                  save_webp(candidates[0][3], dest)

          thesis=tmp/"thesis.pdf"
          ga_pages=find_pages(thesis, "Graphical abstract")
          if len(ga_pages) < 2:
              raise RuntimeError(f"Expected at least two graphical-abstract pages in thesis, found {ga_pages}")

          extract_largest_image(thesis, ga_pages[0], out/"field-denovo-transcriptomics-graphical-abstract.webp")

          envpoll=tmp/"envpoll-ga.jpg"
          if envpoll.exists() and envpoll.stat().st_size > 20000:
              save_webp(envpoll, out/"freshwater-salinisation-graphical-abstract.webp")
          else:
              extract_largest_image(thesis, ga_pages[1], out/"freshwater-salinisation-graphical-abstract.webp")

          save_webp(tmp/"gammarus-fig2.png", out/"gammarus-transcriptome-workflow.webp")

          diversity=tmp/"diversity.pdf"
          # Figure 5 is on page 10 of the 19-page Version of Record.
          fig5_page=10
          extract_largest_image(diversity, fig5_page, out/"aquaculture-metabolomics-key-figure.webp")

          save_webp(tmp/"echogo-logo.png", out/"echogo-logo.webp", maxw=600)

          manifest = [
              f"thesis_graphical_abstract_pages={','.join(map(str,ga_pages[:3]))}",
              f"diversity_figure5_page={fig5_page}",
              "gammarus_source=Scientific Data 2025 Figure 2, CC BY 4.0",
              "salinisation_source=Environmental Pollution 2024 graphical abstract / author thesis fallback, CC BY-NC",
              "field_denovo_source=Escobar-Sierra doctoral thesis chapter 1 graphical abstract, CC BY-NC",
              "metabolomics_source=Diversity 2023 Figure 5, CC BY 4.0",
              "echogo_source=EchoGO v0.1.4 README logo",
          ]
          (out/"ASSET_SOURCES.txt").write_text("\n".join(manifest)+"\n", encoding="utf-8")
          PY

      - name: Create original ARC schematic
        shell: bash
        run: |
          cat > assets/images/publications/arc-concept-schematic.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
            <title id="title">Asymmetric Response Concept</title>
            <desc id="desc">Original schematic showing tolerance as most important during increasing stress, followed by stronger roles for dispersal and biotic interactions after stressor release.</desc>
            <rect width="1000" height="520" fill="#ffffff"/>
            <text x="60" y="48" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14252b">Asymmetric Response Concept</text>
            <text x="60" y="80" font-family="Arial, sans-serif" font-size="17" fill="#627178">Different mechanisms dominate degradation and recovery trajectories</text>
            <line x1="100" y1="420" x2="930" y2="420" stroke="#8da09f" stroke-width="2"/>
            <line x1="100" y1="118" x2="100" y2="420" stroke="#8da09f" stroke-width="2"/>
            <line x1="515" y1="112" x2="515" y2="420" stroke="#98aaa8" stroke-width="2" stroke-dasharray="8 8"/>
            <text x="300" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#425856">Increasing stress</text>
            <text x="720" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#425856">Recovery after stressor release</text>
            <text x="515" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#627178">stressor release</text>
            <text transform="translate(34 270) rotate(-90)" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#425856">Relative importance</text>

            <path d="M110 170 C230 155, 380 165, 500 175 C545 190, 575 245, 615 318 C690 365, 790 376, 920 382"
                  fill="none" stroke="#aa6a3d" stroke-width="7" stroke-linecap="round"/>
            <path d="M110 372 C270 370, 400 368, 500 360 C550 330, 585 250, 650 205 C730 178, 820 225, 920 276"
                  fill="none" stroke="#176b70" stroke-width="7" stroke-linecap="round"/>
            <path d="M110 392 C285 390, 420 385, 500 375 C560 350, 620 300, 700 255 C780 225, 850 220, 920 218"
                  fill="none" stroke="#687f59" stroke-width="7" stroke-linecap="round"/>

            <rect x="645" y="120" width="280" height="96" rx="10" fill="#f7faf9" stroke="#dce5e3"/>
            <line x1="670" y1="148" x2="712" y2="148" stroke="#aa6a3d" stroke-width="7" stroke-linecap="round"/>
            <text x="728" y="154" font-family="Arial, sans-serif" font-size="17" fill="#243039">Stress tolerance</text>
            <line x1="670" y1="177" x2="712" y2="177" stroke="#176b70" stroke-width="7" stroke-linecap="round"/>
            <text x="728" y="183" font-family="Arial, sans-serif" font-size="17" fill="#243039">Dispersal</text>
            <line x1="670" y1="206" x2="712" y2="206" stroke="#687f59" stroke-width="7" stroke-linecap="round"/>
            <text x="728" y="212" font-family="Arial, sans-serif" font-size="17" fill="#243039">Biotic interactions</text>

            <text x="142" y="138" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#aa6a3d">Tolerance dominates response</text>
            <text x="565" y="402" font-family="Arial, sans-serif" font-size="16" fill="#627178">Recovery depends increasingly on recolonisation and interactions</text>
          </svg>
          SVG

      - name: Verify publication assets
        run: |
          set -euo pipefail
          test -s assets/images/publications/gammarus-transcriptome-workflow.webp
          test -s assets/images/publications/freshwater-salinisation-graphical-abstract.webp
          test -s assets/images/publications/field-denovo-transcriptomics-graphical-abstract.webp
          test -s assets/images/publications/arc-concept-schematic.svg
          test -s assets/images/publications/aquaculture-metabolomics-key-figure.webp
          test -s assets/images/publications/echogo-logo.webp
          file assets/images/publications/*

      - name: Commit fetched visuals and remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fetch-publication-visuals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/publications .github/workflows/fetch-publication-visuals.yml
          git commit -m "add publication showcase visuals"
          git push

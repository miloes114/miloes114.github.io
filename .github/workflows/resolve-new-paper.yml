name: Resolve new ScienceDirect paper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resolve-new-paper.yml"

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.head_commit.message == 'resolve new ScienceDirect paper via Crossref'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact Crossref metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-paper assets/images/publications

          found=""
          for n in 104220 104221 104222 104223 104224 104225; do
            doi="10.1016/j.mex.2026.$n"
            code=$(curl -L -sS -o ".tmp-paper/$n.json" -w "%{http_code}" \
              -A "CamiloAcademicWebsite/1.0" \
              "https://api.crossref.org/works/$doi" || true)
            echo "$doi -> $code"
            if [ "$code" = "200" ]; then
              if python3 - "$n" <<'PY'
          import json,sys
          n=sys.argv[1]
          d=json.load(open(f".tmp-paper/{n}.json"))["message"]
          title=" ".join(d.get("title",[]))
          authors="; ".join(" ".join(filter(None,[a.get("given",""),a.get("family","")])) for a in d.get("author",[]))
          print(title)
          print(authors)
          ok=("Escobar-Sierra" in authors or "EchoGO" in title)
          raise SystemExit(0 if ok else 1)
          PY
              then
                found="$n"
                break
              fi
            fi
          done

          test -n "$found"
          cp ".tmp-paper/$found.json" assets/images/publications/new-paper-crossref.json
          python3 - "$found" <<'PY'
          import json,sys
          n=sys.argv[1]
          d=json.load(open(f".tmp-paper/{n}.json"))["message"]
          out={
            "doi": d.get("DOI"),
            "title": (d.get("title") or [None])[0],
            "authors": [
              {"given":a.get("given"),"family":a.get("family"),"ORCID":a.get("ORCID")}
              for a in d.get("author",[])
            ],
            "journal": (d.get("container-title") or [None])[0],
            "published": d.get("published-online") or d.get("published-print") or d.get("published"),
            "volume": d.get("volume"),
            "issue": d.get("issue"),
            "article_number": d.get("article-number") or d.get("page"),
            "type": d.get("type"),
            "url": d.get("URL"),
            "license": d.get("license"),
            "pii": "S2215016126004383"
          }
          print(json.dumps(out,indent=2,ensure_ascii=False))
          open("assets/images/publications/new-paper-metadata.json","w").write(json.dumps(out,indent=2,ensure_ascii=False)+"\n")
          PY

      - name: Fetch original graphical abstract
        shell: bash
        run: |
          set -euo pipefail
          base="https://ars.els-cdn.com/content/image/1-s2.0-S2215016126004383"
          ok=0
          for suf in ga1_lrg.jpg ga1.jpg ga1_lrg.png ga1.png; do
            echo "Trying $suf"
            code=$(curl -L -sS -o ".tmp-paper/$suf" -w "%{http_code}" \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36" \
              -H "Referer: https://www.sciencedirect.com/" \
              -H "Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8" \
              "$base-$suf" || true)
            echo "HTTP $code"
            if [ "$code" = "200" ] && file ".tmp-paper/$suf" | grep -Eqi 'image|JPEG|PNG'; then
              ext=$(printf "%s" "$suf" | awk -F. '{print $NF}')
              cp ".tmp-paper/$suf" "assets/images/publications/echogo-methodsx-graphical-abstract.$ext"
              ok=1
              break
            fi
          done
          test "$ok" -eq 1
          file assets/images/publications/echogo-methodsx-graphical-abstract.*

      - name: Commit resolved source assets and clean workflow
        run: |
          rm -f .github/workflows/resolve-new-paper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/publications .github/workflows/resolve-new-paper.yml
          git commit -m "add published EchoGO metadata and graphical abstract"
          git push

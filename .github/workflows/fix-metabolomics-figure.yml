name: Correct metabolomics figure asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-metabolomics-figure.yml"

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message == 'fix metabolomics source figure extraction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil

      - name: Retrieve exact published Figure 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/publications .tmp-metabolomics
          OUT="assets/images/publications/aquaculture-metabolomics-figure5.png"

          urls=(
            "https://mdpi-res.com/d_attachment/diversity/diversity-15-00031/article_deploy/html/images/diversity-15-00031-g005.png"
            "https://www.mdpi.com/diversity/diversity-15-00031/article_deploy/html/images/diversity-15-00031-g005.png"
          )

          got_direct=0
          for u in "${urls[@]}"; do
            if curl -L --fail --retry 2 --compressed \
              -A "Mozilla/5.0" \
              -e "https://www.mdpi.com/1424-2818/15/1/31" \
              "$u" -o .tmp-metabolomics/figure5.png; then
              if python3 - <<'PY'
          from PIL import Image
          p=".tmp-metabolomics/figure5.png"
          im=Image.open(p)
          assert im.width >= 500 and im.height >= 250
          print("direct Figure 5:", im.size)
          PY
              then
                cp .tmp-metabolomics/figure5.png "$OUT"
                got_direct=1
                break
              fi
            fi
          done

          if [ "$got_direct" -eq 0 ]; then
            # Fallback: extract the embedded raster directly from an open-access Version of Record.
            if ! curl -L --fail --retry 3 -A "Mozilla/5.0" \
              "https://pureadmin.uhi.ac.uk/ws/files/35086235/diversity_15_00031.pdf" \
              -o .tmp-metabolomics/article.pdf; then
              curl -L --fail --retry 3 -A "Mozilla/5.0" \
                "https://findresearcher.sdu.dk/ws/portalfiles/portal/220167770/diversity_15_00031.pdf" \
                -o .tmp-metabolomics/article.pdf
            fi

            pages=$(pdfinfo .tmp-metabolomics/article.pdf | awk '/^Pages:/ {print $2}')
            figpage=""
            for p in $(seq 1 "$pages"); do
              if pdftotext -f "$p" -l "$p" -layout .tmp-metabolomics/article.pdf - 2>/dev/null | grep -qi "Pattern hunter analysis"; then
                figpage="$p"
                break
              fi
            done
            test -n "$figpage"
            echo "Figure 5 located on PDF page $figpage"

            mkdir -p .tmp-metabolomics/extracted
            pdfimages -f "$figpage" -l "$figpage" -png \
              .tmp-metabolomics/article.pdf .tmp-metabolomics/extracted/img

            python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path(".tmp-metabolomics/extracted")
          out=Path("assets/images/publications/aquaculture-metabolomics-figure5.png")
          candidates=[]
          for f in src.glob("img-*.png"):
              try:
                  with Image.open(f) as im:
                      w,h=im.size
                  if w >= 500 and h >= 250:
                      candidates.append((w*h,w,h,f))
              except Exception:
                  pass
          if not candidates:
              raise RuntimeError("No plausible embedded Figure 5 raster found")
          # Figure 5 is the dominant scientific raster on its page.
          candidates.sort(reverse=True)
          print("embedded candidates:", [(w,h,str(f)) for _,w,h,f in candidates])
          chosen=candidates[0][3]
          out.write_bytes(chosen.read_bytes())
          with Image.open(out) as im:
              print("selected Figure 5:", im.size)
          PY
          fi

          python3 - <<'PY'
          from PIL import Image
          p="assets/images/publications/aquaculture-metabolomics-figure5.png"
          im=Image.open(p)
          print("final asset", im.size, im.mode)
          assert im.width >= 500 and im.height >= 250
          PY

          rm -f assets/images/publications/aquaculture-metabolomics-key-figure.webp

      - name: Commit exact source figure and remove one-time workflow
        run: |
          rm -f .github/workflows/fix-metabolomics-figure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/publications .github/workflows/fix-metabolomics-figure.yml
          git commit -m "replace metabolomics visual with published Figure 5"
          git push
